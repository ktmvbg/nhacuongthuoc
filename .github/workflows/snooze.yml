name: Telegram Snooze Reminder

on:
  workflow_dispatch:
    inputs:
      chat_id:
        description: 'Telegram Chat ID'
        required: true
        type: string

jobs:
  snooze:
    runs-on: ubuntu-latest

    steps:
      - name: Wait 10 minutes (600 seconds)
        run: sleep 600

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run snooze script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ github.event.inputs.chat_id }}
        run: python send_snooze.py
